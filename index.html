<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090507" />
  <meta name="description" content="A cinematic, animated Jin Kazama desktop wallpaper with drifting embers and a crimson inferno atmosphere." />
  <title>Jin Kazama — Inferno Live Wallpaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wallpaper" aria-label="Animated Jin Kazama desktop wallpaper">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="smoke smoke-one" aria-hidden="true"></div>
    <div class="smoke smoke-two" aria-hidden="true"></div>
    <div class="inferno-glow" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>
    <section class="hero" aria-hidden="true">
      <img class="character" src="assets/jin-kazama.jpg" alt="" draggable="false" />
    </section>
    <header class="identity">
      <span class="eyebrow"><i></i> THE DEVIL GENE AWAKENS</span>
      <h1>JIN <span>KAZAMA</span></h1>
      <div class="identity-rule"><b></b><span>TEKKEN · INFERNO EDITION</span></div>
    </header>
    <div class="side-mark" aria-hidden="true">
      <span class="side-mark-line"></span><span>✦</span><span class="side-mark-line"></span>
    </div>
    <div class="bottom-mark" aria-hidden="true">
      <span>AWAKEN</span><i></i><span>UNLEASH</span>
    </div>
    <canvas id="embers" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="flash" aria-hidden="true"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
